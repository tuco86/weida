# Release channels of weida. The first channel whose `on` matches an event
# names the pipeline's channel: a push to main is `dev`, a nightly build
# `nightly` and a tagged one `release`. `nightly` has `daily_cleanup`: the
# pipeline the CI's nightly round starts begins each place's workspace
# from nothing, once a day, so caches and target directories cannot grow
# across days. A nightly queued by hand (`ci_run`), a rerun and a release
# tag build on what the workspace holds.
[[channel]]
name = "dev"
on = ["push main"]

[[channel]]
name = "nightly"
on = ["nightly"]
daily_cleanup = true

[[channel]]
name = "release"
on = ["tag v*"]
