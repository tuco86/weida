<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .box     { fill:#ffffff; stroke:#455a64; stroke-width:1.2; }
      .built   { fill:#c8e6c9; stroke:#2e7d32; stroke-width:1.2; }
      .partial { fill:#fff3cd; stroke:#b28704; stroke-width:1.2; }
      .missing { fill:#ffffff; stroke:#90a4ae; stroke-width:1.2; stroke-dasharray:4 3; }
      .band    { fill:#f5f7f8; stroke:none; }
      .lbl     { fill:#263238; }
      .sub     { fill:#546e7a; font-size:10px; }
      .title   { fill:#263238; font-size:14px; font-weight:bold; }
      .side    { fill:#37474f; font-size:11px; font-weight:bold; }
      .arrow   { stroke:#455a64; stroke-width:1.2; fill:none; marker-end:url(#a); }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455a64"/></marker>
  </defs>
  <text x="20" y="28" class="title">What exists, layer by layer (green = built and tested, amber = partial, dashed = absent here)</text>

  <!-- band 1: foreign peers and brokers -->
  <rect x="20" y="44" width="920" height="76" class="band"/>
  <text x="28" y="62" class="side">FOREIGN PEERS</text>
  <text x="28" y="76" class="side">&amp; BROKERS</text>
  <text x="28" y="92" class="sub">what interop ran</text>
  <text x="28" y="104" class="sub">against</text>
  <rect x="140" y="56" width="128" height="52" rx="4" class="built"/><text x="148" y="74" class="lbl">ZeroMQ peers</text><text x="148" y="88" class="sub">libzmq 4.3.5 (zmq)</text><text x="148" y="100" class="sub">zmq.rs 0.6, both roles</text>
  <rect x="274" y="56" width="128" height="52" rx="4" class="built"/><text x="282" y="74" class="lbl">NNG C library</text><text x="282" y="88" class="sub">1.4.0-rc.0, nng crate</text><text x="282" y="100" class="sub">11 tests, both roles</text>
  <rect x="408" y="56" width="128" height="52" rx="4" class="built"/><text x="416" y="74" class="lbl">MQTT 5 brokers</text><text x="416" y="88" class="sub">rumqttd 0.20.0</text><text x="416" y="100" class="sub">rmqtt 0.23.1</text>
  <rect x="542" y="56" width="128" height="52" rx="4" class="built"/><text x="550" y="74" class="lbl">AMQP 1.0 peer</text><text x="550" y="88" class="sub">fe2o3-amqp 0.18.4</text><text x="550" y="100" class="sub">both roles</text>
  <rect x="676" y="56" width="128" height="52" rx="4" class="missing"/><text x="684" y="74" class="lbl">nats-server</text><text x="684" y="88" class="sub">needed by its interop</text><text x="684" y="100" class="sub">interop written, not run</text>
  <rect x="810" y="56" width="128" height="52" rx="4" class="built"/><text x="818" y="74" class="lbl">Python programs</text><text x="818" y="88" class="sub">six bindings, each</text><text x="818" y="100" class="sub">asyncio + synchronous</text>

  <!-- band 2: the competitor libraries -->
  <rect x="20" y="132" width="920" height="182" class="band"/>
  <text x="28" y="150" class="side">COMPETITOR</text>
  <text x="28" y="164" class="side">LIBRARIES</text>
  <text x="28" y="180" class="sub">0013 §4, one</text>
  <text x="28" y="192" class="sub">directory per family</text>
  <text x="28" y="204" class="sub">codec / library /</text>
  <text x="28" y="216" class="sub">Python binding</text>

  <rect x="140" y="144" width="152" height="38" rx="4" class="built"/><text x="148" y="160" class="lbl">weida-zmtp</text><text x="148" y="174" class="sub">ZMTP 3.1, empty deps</text>
  <rect x="140" y="188" width="152" height="50" rx="4" class="built"/><text x="148" y="204" class="lbl">weida-zmq</text><text x="148" y="218" class="sub">11 socket types, 3 transports</text><text x="148" y="231" class="sub">ZAP, 98 option rows</text>
  <rect x="140" y="244" width="118" height="34" rx="4" class="built"/><text x="148" y="259" class="lbl">weida-zmq-py</text><text x="148" y="272" class="sub">asyncio + sync</text>

  <rect x="302" y="144" width="152" height="38" rx="4" class="built"/><text x="310" y="160" class="lbl">weida-sp</text><text x="310" y="174" class="sub">SP v1, empty deps</text>
  <rect x="302" y="188" width="152" height="50" rx="4" class="built"/><text x="310" y="204" class="lbl">weida-nng</text><text x="310" y="218" class="sub">11 protocols, contexts</text><text x="310" y="231" class="sub">48 options, TLS + IPC creds</text>
  <rect x="302" y="244" width="118" height="34" rx="4" class="built"/><text x="310" y="259" class="lbl">weida-nng-py</text><text x="310" y="272" class="sub">asyncio + sync</text>

  <rect x="464" y="144" width="152" height="38" rx="4" class="built"/><text x="472" y="160" class="lbl">weida-mqtt-codec</text><text x="472" y="174" class="sub">15 packets, empty deps</text>
  <rect x="464" y="188" width="152" height="50" rx="4" class="built"/><text x="472" y="204" class="lbl">weida-mqtt</text><text x="472" y="218" class="sub">MQTT 5 client, both QoS</text><text x="472" y="231" class="sub">server half not built</text>
  <rect x="464" y="244" width="118" height="34" rx="4" class="built"/><text x="472" y="259" class="lbl">weida-mqtt-py</text><text x="472" y="272" class="sub">asyncio + sync</text>

  <rect x="626" y="144" width="152" height="38" rx="4" class="built"/><text x="634" y="160" class="lbl">weida-amqp-codec</text><text x="634" y="174" class="sub">9 performatives, empty deps</text>
  <rect x="626" y="188" width="152" height="50" rx="4" class="built"/><text x="634" y="204" class="lbl">weida-amqp</text><text x="634" y="218" class="sub">1.0 client, both credit schemes</text><text x="634" y="231" class="sub">settle modes, dispositions</text>
  <rect x="626" y="244" width="118" height="34" rx="4" class="built"/><text x="634" y="259" class="lbl">weida-amqp-py</text><text x="634" y="272" class="sub">asyncio + sync</text>

  <rect x="788" y="144" width="152" height="38" rx="4" class="built"/><text x="796" y="160" class="lbl">weida-nats-codec</text><text x="796" y="174" class="sub">12 verbs, empty deps</text>
  <rect x="788" y="188" width="152" height="50" rx="4" class="built"/><text x="796" y="204" class="lbl">weida-nats</text><text x="796" y="218" class="sub">core client, both wildcards</text><text x="796" y="231" class="sub">queue groups, inbox reply</text>
  <rect x="788" y="244" width="118" height="34" rx="4" class="built"/><text x="796" y="259" class="lbl">weida-nats-py</text><text x="796" y="272" class="sub">asyncio + sync</text>

  <!-- libraries -> shared foundation -->
  <path d="M216,314 L216,334" class="arrow"/>
  <path d="M540,314 L540,334" class="arrow"/>
  <path d="M864,314 L864,334" class="arrow"/>
  <text x="222" y="330" class="sub">depends on</text>

  <!-- band 3: shared foundation -->
  <rect x="20" y="338" width="920" height="84" class="band"/>
  <text x="28" y="356" class="side">SHARED</text>
  <text x="28" y="370" class="side">FOUNDATION</text>
  <text x="28" y="386" class="sub">no protocol of</text>
  <text x="28" y="398" class="sub">its own</text>
  <rect x="140" y="350" width="300" height="58" rx="4" class="built"/><text x="148" y="368" class="lbl">weida-runtime</text><text x="148" y="383" class="sub">Exec · three reactor owners · capped resolver</text><text x="148" y="397" class="sub">AF_UNIX hygiene · NameRegistry · close budget</text>
  <rect x="452" y="350" width="236" height="58" rx="4" class="built"/><text x="460" y="368" class="lbl">weida-py-core</text><text x="460" y="383" class="sub">one exception class per variant</text><text x="460" y="397" class="sub">asyncio bridge · bytes boundary</text>
  <rect x="700" y="350" width="240" height="58" rx="4" class="built"/><text x="708" y="368" class="lbl">weida-core</text><text x="708" y="383" class="sub">Address (4 schemes) · Limits · errors</text><text x="708" y="397" class="sub">one OS-error vocabulary, not two</text>

  <!-- weida -> shared foundation -->
  <path d="M216,446 L216,426" class="arrow"/>
  <path d="M540,446 L540,426" class="arrow"/>
  <path d="M864,446 L864,426" class="arrow"/>
  <text x="222" y="442" class="sub">depends on</text>


  <!-- band 4: weida itself -->
  <rect x="20" y="446" width="920" height="240" class="band"/>
  <text x="28" y="464" class="side">WEIDA</text>
  <text x="28" y="478" class="side">ITSELF</text>
  <text x="28" y="494" class="sub">protocol · library</text>
  <text x="28" y="506" class="sub">binding · broker</text>
  <rect x="140" y="458" width="152" height="40" rx="4" class="built"/><text x="148" y="475" class="lbl">Patterns</text><text x="148" y="489" class="sub">six · async + blocking</text>
  <rect x="302" y="458" width="152" height="40" rx="4" class="built"/><text x="310" y="475" class="lbl">Ordering</text><text x="310" y="489" class="sub">detect + reassemble</text>
  <rect x="464" y="458" width="152" height="40" rx="4" class="built"/><text x="472" y="475" class="lbl">Dedup</text><text x="472" y="489" class="sub">Bounded(window)</text>
  <rect x="626" y="458" width="152" height="40" rx="4" class="built"/><text x="634" y="475" class="lbl">Cursors</text><text x="634" y="489" class="sub">open levels · own stream</text>
  <rect x="788" y="458" width="152" height="40" rx="4" class="built"/><text x="796" y="475" class="lbl">Pool</text><text x="796" y="489" class="sub">one conn per dialled path</text>
  <rect x="140" y="506" width="380" height="36" rx="4" class="built"/><text x="148" y="522" class="lbl">weida-protocol</text><text x="148" y="536" class="sub">DATA keys 0–14, key 12 reserved; 9 frame kinds, HELLO sets, fuzzed</text>
  <rect x="530" y="506" width="410" height="36" rx="4" class="built"/><text x="538" y="522" class="lbl">Guarantee sets</text><text x="538" y="536" class="sub">core + supersets negotiated; Accepted reported as a cursor (kind 6)</text>
  <rect x="140" y="550" width="380" height="36" rx="4" class="built"/><text x="148" y="566" class="lbl">weida-py</text><text x="148" y="580" class="sub">all six patterns + cursors · asyncio and sync</text>
  <rect x="530" y="550" width="410" height="36" rx="4" class="partial"/><text x="538" y="566" class="lbl">weida-broker</text><text x="538" y="580" class="sub">admit · credit · settle/requeue built; attempt · relay · retire next</text>
  <rect x="140" y="594" width="800" height="30" rx="4" class="built"/><text x="148" y="613" class="lbl">Transport boundary — transport.rs: Link / SendHalf / RecvHalf as enums (no vtable on the payload path)</text>
  <rect x="140" y="636" width="192" height="46" rx="4" class="built"/><text x="148" y="652" class="lbl">QUIC (quinn)</text><text x="148" y="665" class="sub">TLS identity = fingerprint</text><text x="148" y="677" class="sub">one connection per path</text>
  <rect x="342" y="636" width="192" height="46" rx="4" class="built"/><text x="350" y="652" class="lbl">inproc</text><text x="350" y="665" class="sub">duplex channel pair per stream</text><text x="350" y="677" class="sub">peer = None</text>
  <rect x="544" y="636" width="192" height="46" rx="4" class="built"/><text x="552" y="652" class="lbl">AF_UNIX (Linux, macOS)</text><text x="552" y="665" class="sub">control conn + SO_PEERCRED</text><text x="552" y="677" class="sub">shared chunk framing</text>
  <rect x="746" y="636" width="192" height="46" rx="4" class="built"/><text x="754" y="652" class="lbl">Named pipes (Windows)</text><text x="754" y="665" class="sub">built, Windows-gated</text><text x="754" y="677" class="sub">same grouped transport (0012)</text>

  <text x="20" y="704" class="sub">No foreign-protocol library depends on weida or weida-protocol (0013 §4.2): it names its codec, weida-runtime and weida-core, while a codec names nothing.</text>
  <text x="20" y="720" class="sub">Sources: decisions 0013 §4.1–§4.2, 0014 §2; cargo metadata (25 members).</text>
</svg>
