<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .inproc { fill:#81c784; }
      .unix   { fill:#64b5f6; }
      .quic   { fill:#ffb74d; }
      .lbl    { fill:#263238; }
      .sub    { fill:#546e7a; font-size:10px; }
      .title  { fill:#263238; font-size:14px; font-weight:bold; }
      .axis   { stroke:#90a4ae; }
    </style>
  </defs>
  <text x="20" y="28" class="title">Latency by transport (IMPLEMENTATION §4.13, loopback for QUIC, release, both ends in one process)</text>

  <!-- group 1: Req/Rep 1 KiB, scale 10 px per µs -->
  <text x="20" y="66" class="lbl">Req/Rep, 1 KiB</text>
  <g transform="translate(140,50)">
    <rect x="0" y="0"  width="133" height="16" class="inproc"/><text x="139" y="12" class="sub">inproc 13.3 µs</text>
    <rect x="0" y="22" width="507" height="16" class="unix"/>  <text x="513" y="34" class="sub">AF_UNIX 50.7 µs</text>
    <rect x="0" y="44" width="585" height="16" class="quic"/>  <text x="591" y="56" class="sub">QUIC 58.5 µs</text>
  </g>

  <!-- group 2: Req/Rep 1 MiB, scale 0.26 px per µs -->
  <text x="20" y="150" class="lbl">Req/Rep, 1 MiB</text>
  <g transform="translate(140,134)">
    <rect x="0" y="0"  width="38"  height="16" class="inproc"/><text x="44"  y="12" class="sub">inproc 145 µs</text>
    <rect x="0" y="22" width="75"  height="16" class="unix"/>  <text x="81"  y="34" class="sub">AF_UNIX 266–312 µs</text>
    <rect x="0" y="44" width="702" height="16" class="quic"/>  <text x="708" y="56" class="sub">QUIC 2.70 ms</text>
  </g>

  <!-- group 3: Push one-way 1 KiB, scale 24 px per µs -->
  <text x="20" y="234" class="lbl">Push one-way, 1 KiB</text>
  <g transform="translate(140,218)">
    <rect x="0" y="0"  width="49"  height="16" class="inproc"/><text x="55"  y="12" class="sub">inproc 2.05 µs</text>
    <rect x="0" y="22" width="576" height="16" class="unix"/>  <text x="582" y="34" class="sub">AF_UNIX 24.0 µs</text>
    <rect x="0" y="44" width="192" height="16" class="quic"/>  <text x="198" y="56" class="sub">QUIC 8.0 µs</text>
  </g>

  <!-- group 4: Push one-way 1 MiB, scale 0.5 px per µs -->
  <text x="20" y="318" class="lbl">Push one-way, 1 MiB</text>
  <g transform="translate(140,302)">
    <rect x="0" y="0"  width="35"  height="16" class="inproc"/><text x="41"  y="12" class="sub">inproc 58–80 µs</text>
    <rect x="0" y="22" width="70"  height="16" class="unix"/>  <text x="76"  y="34" class="sub">AF_UNIX 130–147 µs</text>
    <rect x="0" y="44" width="680" height="16" class="quic"/>  <text x="686" y="56" class="sub">QUIC 1.36 ms</text>
  </g>

  <line x1="140" y1="45" x2="140" y2="365" class="axis"/>
  <text x="140" y="380" class="sub">bars are scaled per group; read the numbers, not the ratios across groups. A one-way row measures enqueue, not delivery — the round trip is the honest comparison.</text>

  <rect x="20" y="394" width="920" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="30" y="412" class="lbl">What the 1 KiB Push row costs: one connection per transfer is free at 1 MiB and is the whole message at 1 KiB</text>
  <text x="30" y="428" class="sub">A 1 KiB Push over AF_UNIX is 24.0 µs against 8.0 µs over loopback QUIC — 3× slower, because QUIC opens a stream inside a connection it already has while AF_UNIX opens a connection.</text>
  <text x="30" y="444" class="sub">That fixed ~22 µs is the price of not reimplementing a stream layer (0010 §4.2). Memory goes the other way: 0–1761 B per live local connection against 995 KiB for a QUIC one.</text>
</svg>
