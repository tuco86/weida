[package]
name = "weida-broker"
description = "The L2 broker: queues at endpoint paths, publisher confirms, credit and settlement; nothing durable"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# The whole dependency list, deliberately: a broker is an ordinary weida
# process and the layer below it is the public API, not its internals
# (`docs/ARCHITECTURE.md` §4). Nothing in `weida` may depend on this crate,
# and a brokerless deployment does not link it.
weida.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Waits that report instead of killing (B-389).
weida-testkit.workspace = true
# Tests mint a throwaway identity and drive producers over a `SimNet` under a
# paused clock.
weida = { workspace = true, features = ["generate", "test-util"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

# Integration tests are one binary (`tests/main.rs`): see its module docs.
[[test]]
name = "it"
path = "tests/main.rs"
