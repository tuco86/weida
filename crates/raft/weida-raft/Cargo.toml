[package]
name = "weida-raft"
description = "openraft plus the I/O it deliberately leaves out: QUIC transport, TLS-proved node identity and a streamed snapshot channel, so a Raft service supplies only its state machine and log store"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Re-exported, deliberately: a user of this crate writes `impl RaftStateMachine
# for MyApp`, so it needs openraft's own types, and two versions of them in one
# binary do not compose. `weida_raft::openraft` is the one this crate was built
# against (0021 §4.1).
# `generic-snapshot-data` removes the chunked `install_snapshot` from
# `RaftNetwork`: a snapshot is one streamed exchange (`full_snapshot`).
openraft = { workspace = true, features = ["generic-snapshot-data"] }
# The I/O half: connections, exchanges and streamed transfers.
weida.workspace = true
# The bounded CBOR skip of PROTOCOL.md §5, shared rather than copied.
weida-protocol.workspace = true
minicbor.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Clusters run on a `SimNet` under a paused clock.
weida = { workspace = true, features = ["generate", "test-util"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
