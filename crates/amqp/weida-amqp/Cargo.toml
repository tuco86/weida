[package]
name = "weida-amqp"
description = "An AMQP 1.0 client in Rust: connections, sessions and links, usable with no weida in the picture"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# The machine room only: the reactor, the resolver and the close budget, plus
# one OS-error vocabulary at the boundary. `weida` and `weida-protocol` MUST
# NOT appear here (`docs/decisions/0013-competitor-libraries.md` §4.2): an
# AMQP user must not link quinn, rustls and weida's pattern layer to open a
# `tcp://` connection.
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# Receive buffers and delivery payloads: a frame is read once into a shared
# buffer and a delivery is a slice of it, so the common one-frame message is
# never copied. Already in the tree through tokio.
bytes.workspace = true
# The sans-I/O AMQP 1.0 codec: the type system, the frame header, the nine
# performatives, the five SASL bodies, the message sections and the delivery
# states. Reused rather than reimplemented; its own manifest stays empty
# (0013 §4.3).
weida-amqp-codec.workspace = true
# Connection lifecycle logging: a handshake that says nothing is a handshake
# nobody can debug, and AMQP's negotiation has four failure modes that look
# alike from the outside.
tracing.workspace = true
# The TLS layer, on by default. Part 5 §5.2 makes TLS one of the two security
# layers AMQP defines and Service Bus requires it on every path, so a client
# without it is a client that cannot reach a large share of the deployed
# brokers. `--no-default-features` turns it off for a build that has no
# business linking a TLS stack.
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
# Waits that report instead of killing (B-389).
weida-testkit.workspace = true
# A certificate for the TLS tests. The trust anchors are the caller's
# everywhere else; here the test is the caller.
rcgen.workspace = true
# `test-util`: `start_paused` for the tests that wait on a timer.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "test-util"] }
# The interop peer that always runs. `fe2o3-amqp` is a pure-Rust AMQP 1.0
# implementation with an `acceptor` module, so it is a *foreign* peer that
# needs no broker installed and no C toolchain — nothing here is `#[ignore]`d
# on its account. It is a dev-dependency and appears in no build of this
# library ([0014](../../../docs/decisions/0014-parallel-libraries.md) §3).
fe2o3-amqp = { version = "0.17", features = ["acceptor"] }

[features]
default = ["tls"]
# `AMQP %d2 1.0.0`, the TLS handshake, and `AMQP %d0 1.0.0` inside it; plus
# the bare `amqps` listener on 5671, which needs no protocol header at all.
tls = ["dep:tokio-rustls"]

[lints]
workspace = true

# Integration tests are one binary (`tests/main.rs`): see its module docs.
[[test]]
name = "it"
path = "tests/main.rs"

# Its own process: it counts `/proc/self/fd`, which other tests in one process would move.
[[test]]
name = "fd_release"
path = "tests/fd_release.rs"
