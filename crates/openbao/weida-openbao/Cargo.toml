[package]
name = "weida-openbao"
description = "OpenBao/Vault for weida: token, AppRole and wrapped hand-off authentication, and identity sources signed by a PKI mount, anchored on its CA, or read from KV"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# The sources this crate drives: `IdentitySource::external`,
# `TrustSource::external`, and the `Identity`/`Trust` values it feeds them
# ([decisions/0032](../../../docs/decisions/0032-identity-sources-and-the-handoff.md)
# §4.3).
weida.workspace = true
tokio.workspace = true
tracing.workspace = true
# JSON over HTTPS: `weida-http` for HTTP, `serde_json` for the JSON; the TLS
# configuration is built here on the `ring` provider and handed to the
# client, so no process-wide provider is installed.
weida-http.workspace = true
# The `Exec` the HTTP client runs on, and its deadline for one request.
weida-runtime.workspace = true
serde_json.workspace = true
# The client's TLS configuration, by name; the floor is the workspace entry's.
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
# The CSR a `PkiSign` source sends: built over the key it already holds, so
# the fingerprint survives every renewal.
rcgen.workspace = true
# Wipes a token, a secret id and a key PEM from memory when the value that held
# it is dropped; pure Rust, so `unsafe_code = "forbid"` survives it.
zeroize.workspace = true

[dev-dependencies]
# The scripted HTTP server the tests answer from.
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true

# Integration tests are one binary (`tests/main.rs`): see its module docs.
[[test]]
name = "it"
path = "tests/main.rs"
