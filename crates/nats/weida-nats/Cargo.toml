[package]
name = "weida-nats"
description = "A NATS core client in Rust: connections, subscriptions, queue groups and request-reply, usable with no weida in the picture"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The machine room only: the reactor, the resolver and the close budget, plus
# one OS-error vocabulary at the boundary. `weida` and `weida-protocol` MUST
# NOT appear here (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The sans-I/O NATS text-protocol codec: the twelve verbs, the `NATS/1.0`
# header block and the declared-count discipline that keeps a payload from
# ever being scanned for a terminator. Reused rather than reimplemented; its
# own manifest stays empty (0013 §4.3).
weida-nats-codec.workspace = true
# Connection lifecycle logging: a reconnect loop that says nothing is a
# reconnect loop nobody can debug.
tracing.workspace = true
# The read buffer and the delivered `Message`: a message's subject, reply
# subject and payload are reference-counted slices of the one buffer the
# server's octets were read into, so receiving a message copies nothing.
bytes.workspace = true
# The inbox token is unguessable (`request.rs`): any other client in the
# account that can publish on `_INBOX.>` could otherwise forge a reply. The
# operating system's generator, nothing hand-rolled.
rand.workspace = true
# TLS, on by default. `INFO.tls_required` makes it the server's decision
# rather than the client's, so a client that cannot do it is a client that
# cannot connect to a large share of deployments.
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
# A certificate for the TLS tests. The trust anchors are the caller's
# everywhere else; here the test is the caller.
rcgen.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
    "sync",
] }
# The interop peer, on the far side of a real `nats-server`. It is a
# **client**, not a server, so it is no substitute for the binary: two clients
# cannot talk to each other, and where `nats-server` is absent there is no
# interop at all rather than a weaker one (see
# `tests/interop_nats_server.rs`). A dev-dependency, so it appears in no build
# of this library.
async-nats = "0.50"
# Only to reach `StreamExt::next` on the peer's `Subscriber`, which is a
# `Stream` rather than carrying an inherent `next`. Nothing in this library
# uses it: ours is an inherent method on purpose.
futures-util = { version = "0.3", default-features = false }

[features]
default = ["tls"]
# TLS completed before ordinary traffic where `INFO` requires it.
tls = ["dep:tokio-rustls"]

[lints]
workspace = true
