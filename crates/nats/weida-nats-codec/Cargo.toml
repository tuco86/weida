[package]
name = "weida-nats-codec"
description = "NATS client protocol codec: the twelve control-line verbs and the NATS/1.0 header block, sans-I/O"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# No dependencies, deliberately: not even weida-core. The codec is the half of
# the NATS library that can be tested byte-for-byte against the published
# client protocol, so it must not be able to reach for weida's types, its
# limits or its error vocabulary. `weida-nats` depends on this crate and on
# `weida-runtime`; this one depends on neither
# (`docs/decisions/0013-competitor-libraries.md` §4.3).
[dependencies]

[lints]
workspace = true
