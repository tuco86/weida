[package]
name = "weida-runtime"
description = "Reactor ownership, the task/timer/DNS surface and the local-transport OS hygiene shared by weida and the standalone protocol libraries"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The shared vocabulary: `Error` for every failure this crate reports and
# `LocalPrincipal` for what the kernel says about a unix-socket peer. Nothing
# else, and in particular no wire codec: a consumer of this crate implements
# its own protocol
# (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# The Win32 calls a named pipe needs, behind a safe surface, so this crate
# keeps `unsafe_code = "forbid"` on Windows too.
weida-winpipe.workspace = true

[dev-dependencies]
# Waits that report instead of killing (B-389).
weida-testkit.workspace = true
# Drives the owned-reactor test from an executor that is not tokio, which is
# the capability `Exec::owned` exists for.
futures.workspace = true
# `start_paused` for the test that `Exec::now` follows a paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
