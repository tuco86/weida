[package]
name = "weida-c"
description = "The C ABI of weida: libweida and weida.h, the boundary every non-Rust language crosses"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Shipped as a library file and a header, not as a crate
# (docs/decisions/0045-the-c-abi-is-the-boundary.md).
publish = false

# The library is `libweida.so`, `libweida.dylib` or `weida.dll`, linked with
# `-lweida`. The `rlib` lets this crate's own tests call the exports directly.
# On Windows its PDB would collide with the `weida` CLI's `deps/weida.pdb`,
# which is why build.rs moves the DLL's PDB into the build script's OUT_DIR.
# The static `libweida.a`, which Go and Swift link (docs/decisions/0046), is
# built on demand with `cargo rustc -p weida-c --lib --crate-type staticlib`
# (.zeughaus-ci/build.sh `c_abi`): as a third crate type here it made the
# Windows debug links fail on `deps/weida.pdb` (LNK1201).
[lib]
name = "weida"
crate-type = ["cdylib", "rlib"]
doc = false
doctest = false

[dependencies]
# The Rust crate itself, renamed so that it does not collide with this lib
# target's own name. `swarm` links the piece tree's BLAKE3 for SWARM
# (docs/c/swarm.md).
weida_rs = { package = "weida", path = "../weida", features = ["swarm"] }
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The payload of a datagram segment, held without a copy (weida_received).
bytes.workspace = true
# The bytes of a `weida_pem`, which may hold a private key, are wiped on drop.
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# `poll` on a handle's readiness descriptor (docs/c/README.md R11).
nix = { workspace = true, features = ["poll"] }

[target.'cfg(windows)'.dependencies]
# `WSAPoll` on a handle's loopback readiness socket (R11).
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
# Waits that report instead of killing (B-389).
weida-testkit.workspace = true
# The paused clock of the op tests.
tokio = { workspace = true, features = ["test-util"] }
# Builds the two-certificate client chain of the any-key test.
rcgen.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The EINTR test installs a handler and signals one thread.
nix = { workspace = true, features = ["poll", "signal", "pthread"] }

[lints.rust]
# An FFI crate: every export is an `unsafe extern "C" fn`, and every `unsafe`
# block in it states what it relies on. `unsafe_op_in_unsafe_fn` keeps a block
# from hiding inside an `unsafe fn`.
unsafe_op_in_unsafe_fn = "forbid"
