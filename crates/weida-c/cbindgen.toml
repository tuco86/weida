# weida.h, the header C callers include (`header.sh` writes it; the CI job
# `c-abi-linux-amd64` checks it is current).
language = "C"
include_guard = "WEIDA_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
documentation = true
style = "type"
cpp_compat = true
usize_is_size_t = true
header = """/*
 * weida.h: the C ABI of weida (libweida).
 *
 * Generated by cbindgen from crates/weida-c; do not edit. The rules every
 * function follows (R1 to R13) are in docs/c/README.md.
 */"""

[export]
include = ["weida_poll_item"]
