[package]
name = "weida-zmq"
description = "A ZeroMQ implementation in Rust: contexts, sockets and endpoints, usable with no weida in the picture"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# The machine room only: the reactor, the resolver, the AF_UNIX hygiene and
# the name registry, plus one OS-error vocabulary at the boundary. `weida` and
# `weida-protocol` MUST NOT appear here
# (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The sans-I/O ZMTP codec: the greeting, the flags octet and the size field,
# with the declared-length check that makes ZMQ_MAXMSGSIZE enforceable before
# a body is allocated. Reused rather than reimplemented; its own manifest
# stays empty (0013 §4.3).
weida-zmtp.workspace = true
# Connection lifecycle logging: a reconnect loop that says nothing is a
# reconnect loop nobody can debug.
tracing.workspace = true
# CURVE's primitives, named directly so that every secret lives in a buffer
# this crate wipes: X25519 from `curve25519-dalek`, the box from
# `crypto_secretbox` (HSalsa20 for the key, XSalsa20-Poly1305 for the
# seal), and `zeroize` for what holds them. `getrandom` is the operating
# system's randomness: every CURVE key, nonce and cookie key is drawn from
# it, and this crate has no other source of randomness.
curve25519-dalek.workspace = true
crypto_secretbox = { workspace = true, features = ["getrandom"] }
zeroize.workspace = true
# A frame is a refcounted slice of the receive buffer, so that handing it to
# a queue, to every subscriber of a publisher and to the application copies
# no payload.
bytes.workspace = true
# `SO_KEEPALIVE` with an idle time, a probe interval and a probe count on a TCP
# connection, as `ZMQ_TCP_KEEPALIVE` and its three tuning options ask. The
# count is behind `socket2`'s `all` feature, which `tokio` enables for itself
# anyway: naming it here keeps this crate building if that ever changes.
socket2 = { workspace = true, features = ["all"] }
# The executor the blocking facade drives its futures on, and only that: the
# reactor's own threads are busy driving the connections, so a blocking caller
# polls the socket's future on the thread that asked. `weida-runtime`'s Exec
# promises exactly this ("the caller may drive the returned futures on any
# executor - futures::executor::block_on included"); the `blocking` feature is
# that promise taken up. Optional, so a caller that does not want the facade
# does not link it.
futures = { workspace = true, optional = true }
# libzmq itself, for the interop tests — the reference implementation this
# library is measured against, reached through the `zmq` crate's bindings.
#
# **Optional and off**, because cargo forbids an optional dev-dependency and
# linking libzmq must not be a condition of building this crate's tests: a
# machine without the C library builds and tests everything else. Turn it on
# with `--features libzmq-interop`; the tests are `#[ignore]`d on top of that,
# so `--ignored` is the deliberate step that runs them.
#
# **0.9 and not 0.10 on purpose.** `zmq-sys` 0.12 (which `zmq` 0.10 requires)
# always builds libzmq from source, and that build reports
# `zmq_has("curve") == false`, so CURVE could not be measured against it at
# all. 0.9's `zmq-sys` 0.11 links the system library through `pkg-config`,
# which is the library a deployment actually meets: with libsodium behind it
# CURVE exists and the boxes are libsodium's.
zmq = { version = "0.9", optional = true }

[dev-dependencies]
# Waits that report instead of killing (B-389).
weida-testkit.workspace = true
# Drives the owned-context doctest and tests from an executor that is not
# tokio, which is what `Context::owned` exists for.
futures.workspace = true
# `start_paused` for the tests that wait on a timer.
tokio = { workspace = true, features = ["test-util"] }
# The compile-fail harness for libzmq's thread rule: a socket is `Send` and
# **not** `Sync`, and the second half only a compiler can assert.
trybuild.workspace = true
# The independent ZeroMQ the interop tests measure against: a pure-Rust
# implementation that shares no code and no assumptions with ours, so a
# disagreement is an interoperability bug rather than a tautology. Tests
# only, and no supervised process - `cargo test` is the whole apparatus.
zeromq.workspace = true
# RustCrypto's `crypto_box`, NaCl's construction from another implementation.
# The local CURVE box is checked against it byte for byte in the tests; the
# library builds its boxes from the primitives above and does not depend on it.
crypto_box.workspace = true

[features]
# The synchronous facade, off by default: `weida_zmq::blocking`. Not default
# because a caller that already runs a reactor wants the asynchronous sockets,
# and a feature nobody asked for is a reactor nobody asked for
# (`ContextConfig::worker_threads` threads, owned by the context).
blocking = ["dep:futures"]
# The libzmq interop tests. Off by default because the C library is a build
# condition, not a runtime one: with this on and libzmq absent, nothing links.
libzmq-interop = ["dep:zmq"]

[[example]]
# The zguide's Lazy Pirate, chapter 4.
name = "lazy_pirate"
required-features = ["blocking"]

[[example]]
# The zguide's Simple Pirate over the chapter 3 load-balancing broker.
name = "simple_pirate"
required-features = ["blocking"]

[[example]]
# The zguide's Paranoid Pirate, queue and worker, both async.
name = "paranoid_pirate"

[[example]]
# The zguide's Majordomo (18/MDP 0.2): broker, worker and client.
name = "majordomo"

[[example]]
# The zguide's Freelance, models one and two (10/FLP).
name = "freelance"

[[example]]
# The zguide's Clone, on 12/CHP's three-port wire.
name = "clone"

[[example]]
# The zguide's Binary Star: the state machine and the PUB-SUB exchange.
name = "binary_star"

[[example]]
# The zguide's Espresso: the proxy capture socket as a pub-sub trace.
name = "espresso"

[[example]]
# The zguide's Last Value Caching: an XSUB/XPUB proxy with a cache.
name = "last_value_cache"

[[example]]
# The zguide's Hello World, in the shape its C original has.
name = "hello_world"
required-features = ["blocking"]

[lints]
workspace = true

# Integration tests are one binary (`tests/main.rs`): see its module docs.
[[test]]
name = "it"
path = "tests/main.rs"
