[package]
name = "weida-zmtp"
description = "ZMTP 3.1 codec: greeting, framing, NULL handshake and commands, sans-I/O"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# No dependencies, deliberately: not even weida-core. The codec is the half of
# the ZeroMQ library that can be tested byte-for-byte against a foreign
# specification, so it must not be able to reach for weida's types, its limits
# or its error vocabulary. `weida-zmq` depends on this crate and on
# `weida-runtime`; this one depends on neither
# (`docs/decisions/0013-competitor-libraries.md` §4.3).
autotests = false

[dependencies]

[lints]
workspace = true

# Integration tests are one binary (`tests/main.rs`): see its module docs.
[[test]]
name = "it"
path = "tests/main.rs"
