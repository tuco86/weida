[package]
name = "weida-zmtp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# Its own workspace (see below), so nothing to inherit; unpublished, so the
# manifest needs no registry metadata.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weida-zmtp = { path = ".." }

# Deliberately its own workspace: the fuzz crate needs nightly and must not
# affect `cargo build --workspace` or the lockfile of the library crates.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_stream"
path = "fuzz_targets/frame_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command"
path = "fuzz_targets/command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "greeting"
path = "fuzz_targets/greeting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "curve_command"
path = "fuzz_targets/curve_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "initiate_plaintext"
path = "fuzz_targets/initiate_plaintext.rs"
test = false
doc = false
bench = false
