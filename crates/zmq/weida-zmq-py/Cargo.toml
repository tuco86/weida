[package]
name = "weida-zmq-py"
description = "The Python binding of weida-zmq: asyncio ZeroMQ sockets on the Rust implementation, with libzmq's errno vocabulary as exception classes"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# The Python module is `weida_zmq` — that is what `#[pymodule] fn weida_zmq`
# and therefore the `PyInit_weida_zmq` symbol say, and what `module-name` in
# pyproject.toml names the file maturin writes into the wheel. The *crate*
# cannot be called that as well: rustdoc writes one directory per lib name and
# `weida-zmq` already owns `weida_zmq`, so `cargo doc --workspace` would refuse
# the collision.
name = "weida_zmq_py"
crate-type = ["cdylib"]
# A cdylib has no rlib for rustdoc to link a doctest against, so the examples
# in this crate's documentation are Python rather than Rust and are run by
# `pytest`, not by `cargo test`.
doctest = false

[dependencies]
# The shared foundation: exception families, the asyncio bridge, the bytes
# boundary. Every binding in this workspace sits on it and none re-derives it
# (`docs/decisions/0014-parallel-libraries.md` §2).
weida-py-core.workspace = true
pyo3.workspace = true
# The library being bound. Nothing of weida is reachable through it, which is
# the dependency direction 0013 §4.2 fixed.
# `blocking` is on because `weida_zmq.sync` is the facade over it: one wrapper
# per socket type over a context that owns its reactor, so a Python program
# needs no event loop (0013 §4.4 item 3). It is the library's own facade rather
# than a second implementation of anything.
weida-zmq = { workspace = true, features = ["blocking"] }
# Two things and no more: `tokio::sync::Mutex`, which is what makes a socket
# that is `Send + !Sync` shareable between coroutines without ever being used
# by two at once, and `runtime::Handle`, which is the value
# `Context::with_handle` takes — the third of the three constructors
# (0013 §4.4) cannot be offered to Python without naming it.
tokio.workspace = true

[features]
# Off by default, and enabled by maturin through `pyproject.toml`. With it on,
# the extension does not link libpython — which is right for a wheel and wrong
# for `cargo test`, because a test binary is an executable and would be left
# with undefined symbols. Cargo unifies features across a workspace build, so a
# default-on `extension-module` here would break `cargo test --workspace` for
# `weida-py-core` as well.
extension-module = ["pyo3/extension-module"]

[lints.rust]
# As in `weida-py-core`: PyO3's macros expand to `unsafe impl`s, so `forbid` is
# not available. No `unsafe` is written by hand in this crate.
unsafe_code = "allow"
