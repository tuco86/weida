[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "weida"
description = "weida for Python: all six patterns over QUIC — Req/Rep, Push/Pull, Pub/Sub, Pair, Survey and Bus — asyncio and synchronous, on the Rust implementation"
requires-python = ">=3.9"
# Taken from the crate, which takes it from the workspace: one version for the
# library and its binding, typed once.
dynamic = ["version"]
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["quic", "asyncio", "messaging", "rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/tuco86/weida"

[tool.maturin]
module-name = "weida"
# The wheel must not link libpython; the workspace's Rust tests must. The
# feature therefore lives here rather than in the crate's defaults — see the
# comment on `extension-module` in Cargo.toml.
features = ["pyo3/extension-module"]
