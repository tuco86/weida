[package]
name = "weida-mqtt"
description = "An MQTT 5.0 client in Rust: connection, session, QoS and subscriptions, usable with no weida in the picture"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# The machine room only: the reactor, the resolver and one OS-error vocabulary
# at the boundary. `weida` and `weida-protocol` MUST NOT appear here
# (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The receive buffer: packets are decoded where they were read, and `BytesMut`
# is a buffer whose front can be consumed in O(1), which a `Vec` is not.
bytes.workspace = true
# The sans-I/O MQTT 5.0 codec: the fixed header, the property framework and
# all fifteen packets, with the declared-length check that makes `Maximum
# Packet Size` enforceable before a body is allocated. Reused rather than
# reimplemented; its own manifest stays empty (0013 §4.3).
weida-mqtt-codec.workspace = true

# TLS on 8883. Optional, because MQTT on 1883 is a complete protocol and a
# client that only ever speaks to a broker on a trusted local network has no
# business linking a TLS stack. The trust anchors are **not** here:
# `TlsOptions` takes the caller's `rustls::ClientConfig`, because which
# certificates an application trusts is the application's decision and not a
# messaging library's (5.4.3).
tokio-rustls = { workspace = true, optional = true }

# The executor the blocking facade drives its futures on, and only that: the
# reactor's own threads are busy driving the connection, so a blocking caller
# polls the client's future on the thread that asked. `weida-runtime`'s Exec
# promises exactly this ("the caller may drive the returned futures on any
# executor - futures::executor::block_on included"); the `blocking` feature is
# that promise taken up. Optional, so a caller that does not want the facade
# does not link it.
futures = { workspace = true, optional = true }

[dev-dependencies]
# Waits that report instead of killing (B-389).
weida-testkit.workspace = true
# Drives the owned-context tests from an executor that is not tokio, which is
# what `Context::owned` exists for.
futures.workspace = true
# `start_paused` for the tests that wait on a timer.
tokio = { workspace = true, features = ["test-util"] }
# A certificate for the TLS tests. The trust anchors are the caller's
# everywhere else; here the test is the caller.
rcgen.workspace = true

[features]
default = ["tls"]
# The synchronous facade, off by default: `weida_mqtt::blocking`. Not default
# because a caller that already runs a reactor wants the asynchronous client,
# and a facade nobody asked for is a `futures` dependency nobody asked for.
blocking = ["dep:futures"]
# `mqtts` on 8883: the TLS handshake completed before the CONNECT is written,
# which is what makes the credentials in it worth sending.
tls = ["dep:tokio-rustls"]

[lints]
workspace = true

# Integration tests are one binary (`tests/main.rs`): see its module docs.
[[test]]
name = "it"
path = "tests/main.rs"
