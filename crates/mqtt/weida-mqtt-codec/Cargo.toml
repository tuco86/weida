[package]
name = "weida-mqtt-codec"
description = "MQTT 5.0 wire codec: fixed header, Variable Byte Integers, the property framework and the control packets, sans-I/O"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# No dependencies, deliberately: not even weida-core. The codec is the half of
# the MQTT work that can be tested byte-for-byte against the OASIS standard, so
# it must not be able to reach for weida's types, its limits or its error
# vocabulary. `weida-mqtt` depends on this crate and on `weida-runtime`; this
# one depends on neither (`docs/decisions/0013-competitor-libraries.md` §4.3).
[dependencies]

[lints]
workspace = true
