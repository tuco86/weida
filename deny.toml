# cargo-deny, as the `audit` job runs it: `cargo deny --locked check advisories sources`.
# docs/SECURITY.md says how a finding is handled; every ignore names why weida is not affected.
[graph]
# Feature-gated dependencies (h3, blocking, swarm, ...) are shipped too.
all-features = true

[advisories]
# Each entry is { id = "RUSTSEC-...", reason = "why weida is not affected" }.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono (unmaintained, no vulnerability) is reached only through openraft 0.9, which formats its own Instants for log and Debug output with it (display_ext::DisplayInstant), and openraft-macros, which checks `#[since(date = ..)]` literals at compile time; no peer input reaches chrono, and openraft 0.10.0 still depends on it unconditionally" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
