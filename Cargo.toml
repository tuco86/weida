[workspace]
resolver = "3"
members = [
    # weida itself: the protocol, its runtime and its shared plumbing.
    "crates/core",
    "crates/protocol",
    "crates/runtime",
    "crates/weida",
    # L2, and a layer rather than a fork: it depends on `weida` and nothing
    # depends on it (0018 §4.1).
    "crates/broker",
    # openraft plus the I/O it deliberately does not have: weida's transport
    # under it, so a Raft service supplies only its state machine and log store
    # ([decisions/0021](docs/decisions/0021-consensus-openraft.md)).
    "crates/raft/weida-raft",
    # The one crate that calls Win32; empty everywhere else.
    "crates/winpipe",
    # One directory per foreign protocol family: codec, standalone library
    # and language bindings together (0013 §4.1).
    "crates/zmq/weida-zmtp",
    "crates/zmq/weida-zmq",
    "crates/zmq/weida-zmq-py",
    "crates/nng/weida-sp",
    "crates/nng/weida-nng",
    "crates/nng/weida-nng-py",
    "crates/mqtt/weida-mqtt-codec",
    "crates/mqtt/weida-mqtt",
    "crates/mqtt/weida-mqtt-py",
    "crates/amqp/weida-amqp-codec",
    "crates/amqp/weida-amqp",
    "crates/amqp/weida-amqp-py",
    "crates/nats/weida-nats-codec",
    "crates/nats/weida-nats",
    "crates/nats/weida-nats-py",
    "crates/http/weida-http-codec",
    "crates/http/weida-http",
    # The shared PyO3 foundation every Python binding sits on, with nothing
    # protocol-specific in it (0014 §2).
    "crates/py/weida-py-core",
    "crates/py/weida-py",
    # The OpenBao client and the identity sources it drives, in its own
    # crate because of the two dependencies below
    # ([decisions/0032](docs/decisions/0032-identity-sources-and-the-handoff.md) §4.3).
    "crates/openbao/weida-openbao",
    # Test support for every crate above, never published: waits that report
    # instead of killing (`crates/testkit/src/lib.rs`).
    "crates/testkit",
    # Throughput and latency harness between two hosts or over loopback;
    # never published (B-390).
    "crates/perf",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0-alpha.9-dev"
# Dual, in the Rust ecosystem's own form: the MIT arm is the permissive
# minimum every downstream already accepts, and the Apache-2.0 arm is the one
# that carries an explicit patent grant, which is what a corporate reviewer
# needs in order to approve a dependency. Every crate this workspace builds on
# — std, tokio, quinn, rustls, openraft — is licensed exactly this way, so our
# terms are a superset of our own dependency graph's rather than a new
# condition on top of it.
license = "MIT OR Apache-2.0"
repository = "https://github.com/tuco86/weida"
homepage = "https://weida.doodleshnookie.net"
# Five is the cap crates.io enforces, twenty bytes each.
keywords = ["messaging", "quic", "broker", "async", "protocol"]
categories = ["network-programming", "asynchronous"]

[workspace.lints.rust]
# Inherited with `[lints] workspace = true`. `weida-winpipe` and the PyO3 crates
# cannot forbid it and carry their own table.
unsafe_code = "forbid"

[workspace.dependencies]
weida-core = { path = "crates/core", version = "0.1.0-alpha.9-dev" }
weida-protocol = { path = "crates/protocol", version = "0.1.0-alpha.9-dev" }
weida-runtime = { path = "crates/runtime", version = "0.1.0-alpha.9-dev" }
weida-winpipe = { path = "crates/winpipe", version = "0.1.0-alpha.9-dev" }
weida = { path = "crates/weida", version = "0.1.0-alpha.9-dev" }
weida-broker = { path = "crates/broker", version = "0.1.0-alpha.9-dev" }
weida-raft = { path = "crates/raft/weida-raft", version = "0.1.0-alpha.9-dev" }
weida-zmtp = { path = "crates/zmq/weida-zmtp", version = "0.1.0-alpha.9-dev" }
weida-zmq = { path = "crates/zmq/weida-zmq", version = "0.1.0-alpha.9-dev" }
weida-sp = { path = "crates/nng/weida-sp", version = "0.1.0-alpha.9-dev" }
weida-nng = { path = "crates/nng/weida-nng", version = "0.1.0-alpha.9-dev" }
weida-py-core = { path = "crates/py/weida-py-core", version = "0.1.0-alpha.9-dev" }
weida-amqp-codec = { path = "crates/amqp/weida-amqp-codec", version = "0.1.0-alpha.9-dev" }
weida-zmq-py = { path = "crates/zmq/weida-zmq-py", version = "0.1.0-alpha.9-dev" }
weida-nng-py = { path = "crates/nng/weida-nng-py", version = "0.1.0-alpha.9-dev" }
weida-mqtt-codec = { path = "crates/mqtt/weida-mqtt-codec", version = "0.1.0-alpha.9-dev" }
weida-mqtt = { path = "crates/mqtt/weida-mqtt", version = "0.1.0-alpha.9-dev" }
weida-mqtt-py = { path = "crates/mqtt/weida-mqtt-py", version = "0.1.0-alpha.9-dev" }
weida-amqp = { path = "crates/amqp/weida-amqp", version = "0.1.0-alpha.9-dev" }
weida-amqp-py = { path = "crates/amqp/weida-amqp-py", version = "0.1.0-alpha.9-dev" }
weida-nats-codec = { path = "crates/nats/weida-nats-codec", version = "0.1.0-alpha.9-dev" }
weida-nats = { path = "crates/nats/weida-nats", version = "0.1.0-alpha.9-dev" }
weida-nats-py = { path = "crates/nats/weida-nats-py", version = "0.1.0-alpha.9-dev" }
weida-http-codec = { path = "crates/http/weida-http-codec", version = "0.1.0-alpha.9-dev" }
weida-http = { path = "crates/http/weida-http", version = "0.1.0-alpha.9-dev" }
weida-openbao = { path = "crates/openbao/weida-openbao", version = "0.1.0-alpha.9-dev" }
# Path only, no version: a dev-dependency `cargo publish` drops.
weida-testkit = { path = "crates/testkit" }
# The JSON of the OpenBao API, `Value` only, no derive; `weida-openbao` alone.
serde_json = "1"
# Public roots for an OpenBao behind a public certificate when no CA is
# configured (`weida-openbao` alone): the Mozilla set, nothing platform-specific.
webpki-roots = "1"
# The piece tree of SWARM ([decisions/0040](docs/decisions/0040-swarm-pattern.md)
# §4): `blake3::hazmat` gives the position-bound chaining values and the
# subtree merge, so the root of a piece tree equals `blake3::hash` of the whole
# blob. Linked only with the `swarm` feature of `weida`.
blake3 = "1.8"

# 0.11.12 is the first release that requires `quinn-proto` 0.11.18, whose
# `PathStats` carries `min_rtt` ([decisions/0036](docs/decisions/0036-connection-statistics.md) §2.1).
quinn = "0.11.12"
# The consensus engine behind `weida-raft`, and a dependency rather than a
# subsystem ([decisions/0021](docs/decisions/0021-consensus-openraft.md)): the
# part of writing one that matters is the invariant harness this crate already
# runs tick by tick against the paper and the TLA+ spec. Pinned to the stable
# 0.9 line, because its own README promises incompatible changes before 1.0.
# `weida-raft` is the only crate that names openraft; it re-exports it, so a
# `weida-raft` release names one openraft minor line.
# `storage-v2` unseals `RaftLogStorage`/`RaftStateMachine` for third-party
# crates — without it the only implementable storage trait is the v1
# `RaftStorage` behind an `Adaptor`, and v2 is what 0.10 makes the sole API.
# Writing against v2 now is the cheaper migration.
openraft = { version = "0.9", features = ["storage-v2"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "io-util",
    "time",
    "net",
] }
# TLS for two libraries, one entry: the layer AMQP reaches either by
# protocol-id %d2 or as a bare `amqps` listener (Part 5 §5.2), and the
# `tls+tcp` transport of `weida-nng`. `rustls` 0.23 is already in this
# workspace's graph through quinn and `ring` is the provider weida's QUIC
# transport already uses, so this adds the tokio adapter and **no second TLS
# stack and no second cryptographic backend**; pure Rust, so
# `unsafe_code = "forbid"` survives it and no OpenSSL is linked. The trust
# anchors are **not** here: `weida-amqp` takes the caller's
# `rustls::ClientConfig`, because which certificates an application trusts is
# the application's decision and not a messaging library's.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
# Used by name only where a crate takes a caller's configuration
# (`weida-http`, `weida-openbao`); the others reach rustls through
# `quinn::rustls` or `tokio_rustls::rustls`. The direct entry exists for its floor, so that a
# downstream lockfile cannot resolve a rustls with RUSTSEC-2026-0285, -0346,
# -0348 or -0349 (handshake messages across encryption levels, secrets in
# `Debug`, brotli certificate decompression before authentication, a
# ServerHello downgrade). The published crates that speak TLS depend on it.
rustls = { version = "0.23.46", default-features = false }
bytes = "1"
# `weida-nng` sets TCP keepalive on the connections it accepts and dials,
# which tokio's `TcpStream` has no call for. Already in the graph through
# tokio and quinn, so this adds an edge and no crate.
socket2 = "0.6"
# The caller's executor need not be tokio: transfers implement both trait
# families, and the `futures` dev-dependency drives the no-tokio test.
futures-io = "0.3"
futures = "0.3"
tracing = "0.1"
rand = "0.9"
minicbor = { version = "2", features = ["alloc"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
ring = "0.17"
# RustCrypto's NaCl-compatible `crypto_box`: X25519 key agreement, HSalsa20 to
# derive the shared key, XSalsa20-Poly1305 for the box - which is exactly the
# construction 26/CURVEZMQ is specified in terms of, rather than a lookalike,
# so a box this workspace seals opens in libsodium and libzmq. `weida-zmq`
# uses it only in its tests, as the independent implementation the library's
# own composition (below) is checked against. Pure Rust, so
# `unsafe_code = "forbid"` survives it.
crypto_box = "0.9"
# The primitives under CURVE, named directly. `crypto_box` keeps the raw bytes
# of every `SecretKey` it is handed in a field its `Drop` does not wipe, so a
# secret that passes through it outlives the connection in freed memory;
# owning the Diffie-Hellman step (X25519, then HSalsa20, which is all
# `crypto_box_beforenm` is) keeps every secret in a `Zeroizing` buffer.
# `crypto_box` stays for the tests, as the independent implementation the
# local one is checked against. All three are already in the graph through
# `crypto_box` itself, so this adds edges and no crate.
crypto_secretbox = { version = "0.1", default-features = false, features = ["alloc", "salsa20"] }
curve25519-dalek = { version = "4", default-features = false, features = ["precomputed-tables", "zeroize"] }
zeroize = "1"
# The Python bindings' one foreign dependency: CPython through PyO3.
# `abi3-py39` is the limited API, so one wheel covers every CPython from 3.9
# on, which is what the bindings' registry metadata promises. The bindings
# hold this version in common because two PyO3 versions in one interpreter
# cannot share a type object.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# Tests, benches and examples only.
# Also an optional dependency of `weida` (the `generate` feature) and a normal
# dependency of `weida-openbao`; the entry lives here because every use shares
# one version.
rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = { version = "0.8", features = ["async_tokio"] }
# The foreign peer for the ZMTP interop bench and tests: a pure-Rust ZeroMQ that
# shares no code and no assumptions with our codec, which is the only thing that
# turns "we agree with ourselves" into interoperability. Tests and benches
# only.
zeromq = "0.6"
# Proves a negative the type system holds and no runtime test can see: a
# socket shared between threads must not compile. Tests only.
trybuild = "1"

# Every integration test, example and bench is its own binary that links tokio,
# quinn and rustls statically; with full debuginfo each weighs hundreds of MB,
# and one gate run (seven feature configurations) filled tens of GB of disk and
# spent most of its time in the linker. Line tables keep file and line in a
# backtrace, which is what a failing test needs; dependencies keep none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
